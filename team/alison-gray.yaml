  bio: Alison Gray is an oceanographer who studies the circulation of the ocean and its impact on the physics and chemistry of the climate system. 
    She uses observations from many different sources, including profiling floats, gliders, satellites, and ships, to investigate the dynamics of the ocean circulation on a variety of scales. 
    Her research also aims to improve our understanding of the interactions between ocean circulation and global biogeochemical cycles.
