  bio: Stephen Riser is an oceanographer with long-term interests in the interactions of the physical and chemical aspects of the circulation of the large-scale ocean. 
    He focuses on the use of profiling float technology to study ocean circulation at a global level, and his laboratory has built and deployed over 1400 floats in the past decade in support of these studies. 
    With his laboratory, he has also pioneered the use of many of the technologies presently used in modern profiling floats, including the addition of biogeochemical sensors, under-ice technology, and the use of Iridium communications.
