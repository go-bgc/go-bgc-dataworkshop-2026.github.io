  bio:  Mari's research uses autonomous robotic platforms such as Biogeochemical-Argo floats alongside multiplatform observations to investigate how extreme climate events affect marine ecosystems. 
    She studies how marine heatwaves and low-oxygen conditions alter food webs, the biological carbon pump, nitrogen cycling and ocean chemistry throughout the global ocean. 
    Her work aims to better understand how changing ocean conditions reshape marine biogeochemical cycles.
