  bio:  I am a polar oceanographer and a Southern Ocean Carbon Climate Observations and Modeling (SOCCOM) research associate fellow at MBARI. 
    Using robotic floats, satellites, model outputs, and artificial intelligence, I investigate how physical and biological processes interact to shape Southern Ocean ecosystems. 
    At MBARI, my research focuses on developing new tools to explore and monitor changes in polar ecosystems in near real-time.
